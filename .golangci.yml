version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose      # leaking HTTP bodies against a Proxmox API is a real bug source
    - contextcheck
    - errorlint
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - wastedassign

  settings:
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]
        - name: package-comments
    errcheck:
      check-type-assertions: true

  exclusions:
    rules:
      # Test helpers may ignore errors and skip context plumbing.
      - path: _test\.go
        linters: [errcheck, noctx, unparam, revive]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
