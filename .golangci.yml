version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose      # leaking HTTP bodies against a Proxmox API is a real bug source
    - contextcheck
    - errorlint
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - wastedassign

  settings:
    revive:
      rules:
        - name: exported
          # disableChecksOnMethods: almost every exported method here
          # implements an interface that already documents the contract
          # (core.Check, store.Store, api.Providers, core.Hypervisor...).
          # The doc belongs on the interface: copying it onto Noop.ListTokens,
          # sqlStore.Describe, TCPCheck.Run and the rest produces a dozen
          # comments that say nothing and drift the moment the interface
          # changes. Exported types, constants, variables and plain functions
          # are still required to carry one.
          arguments: [checkPrivateReceivers, disableChecksOnMethods]
        - name: package-comments
    errcheck:
      check-type-assertions: true
      # Writes to a terminal, and the tabwriter flushes behind them, are the
      # one place where an ignored error is the honest answer: there is
      # no recovery action for "the user's stdout is gone", and checking
      # every Fprintf in the CLI would bury the calls that matter. Every
      # fmt.Fprint* target in this repo is a display writer (a.out, a.err,
      # a cobra command's stream) or an in-memory bytes.Buffer, which cannot
      # fail at all. Writes to real files go through the report writers and
      # are checked there.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush

  exclusions:
    rules:
      # Test helpers may ignore errors and skip context plumbing.
      - path: _test\.go
        linters: [errcheck, noctx, unparam, revive, contextcheck]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
