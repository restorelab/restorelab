name: Release

# A tag is the trigger, and the tag name is the version. Nothing else
# publishes: pushing to master builds and tests, it does not release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # creating a release and uploading its archives
  packages: write # publishing the image to ghcr.io

env:
  GO_VERSION: "1.27"

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Tags and full history: --generate-notes reads the commits since
          # the previous tag, and it cannot do that from a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # A tag is not a promise that the code is green.
      #
      # This is a gate against tagging a broken commit, not a second CI: the
      # race detector and the PostgreSQL conformance run on every push to
      # master already, and re-running them here would double a five-minute
      # job to catch something that push has just caught.
      - name: go test
        run: go test ./...

      # The version comes from the tag, not from `git describe`.
      #
      # describe would work here - fetch-depth: 0 brought the tags - but it
      # would also quietly produce a binary stamped with a commit sha if that
      # ever changed. The tag is what the release is named after, so it is
      # what the binary should say when asked.
      - name: make dist
        run: make dist VERSION=${{ github.ref_name }}

      # The image, published under the same version as the archives.
      #
      # `docker run ghcr.io/restorelab/restorelab` is the shortest path from
      # hearing about this to seeing it run, and it is worth more than a
      # download page. It is built here rather than promoted from the `edge`
      # image CI pushes: that one is stamped VERSION=edge, and a release
      # binary that answers "edge" when asked its version is a support ticket
      # waiting to happen.
      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` must not move on a pre-release. A tag carrying a hyphen -
      # v0.3.0-rc1 - publishes under its own name and nothing else, so
      # `docker run ghcr.io/restorelab/restorelab` keeps meaning the newest
      # release somebody is meant to actually run.
      - name: work out the image tags
        id: image
        run: |
          image="ghcr.io/${{ github.repository }}"
          tags="$image:${{ github.ref_name }}"
          case "${{ github.ref_name }}" in
            *-*) ;;
            *) tags="$tags,$image:latest" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: publish the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "${{ github.ref_name }}"
