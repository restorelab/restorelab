name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # The store speaks to two engines from one query set, and a conformance
    # suite is what keeps them from drifting apart. SQLite is embedded, so it
    # runs anywhere; PostgreSQL needs a server, and without one here the
    # second half of that promise is never actually checked.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: restorelab
          POSTGRES_PASSWORD: restorelab
          POSTGRES_DB: history
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restorelab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RESTORELAB_TEST_DATABASE_URL: postgres://restorelab:restorelab@127.0.0.1:5432/history?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l $(find . -name '*.go' -not -path './web/*'))
          if [ -n "$out" ]; then echo "not gofmt-clean:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # `make lint`, not the action: the action ships a prebuilt golangci-lint
      # that refuses to analyse a module targeting a newer Go than the one it
      # was built with, and go.mod is ahead of it. Running the same command a
      # developer runs also removes the possibility of the two disagreeing.
      - run: make lint

  # The dashboard has its own toolchain and its own tests. This job does not
  # depend on `backend`: the two have nothing to say to each other, and a Go
  # failure should not hide a TypeScript one.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: biome
        run: npm run lint
      - name: vitest
        run: npm test
      # `npm run build` is `vite build && tsc --noEmit`, in that order, and the
      # order is not cosmetic: it is the router plugin that writes
      # routeTree.gen.ts, and that file is generated, not committed. A bare
      # `tsc` step ahead of this one would fail on a fresh checkout against a
      # route tree that does not exist yet.
      - name: build and typecheck
        run: npm run build

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile
          push: false
          tags: restorelab:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
